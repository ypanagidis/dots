[package]
name = "niri-ctx"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "niri-ctx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
niri-ipc = "=26.4.0"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
insta = "1"
tempfile = "3"
