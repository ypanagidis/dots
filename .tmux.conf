# Tmux config extracted from the Nix setup for normal macOS use.

set -g default-terminal "tmux-256color"
set -g prefix C-s
unbind C-b
bind C-s send-prefix
set -g mouse on
set -g base-index 1
set -g pane-base-index 1

# Optional TPM plugins. If TPM is absent, vim-tmux-navigator is sourced directly below.
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @override_copy_command 'pbcopy'

# Passthrough for links and OSC sequences.
set -g allow-passthrough on
set -ga terminal-features "*:hyperlinks"

# Keyboard fixes.
set-window-option -g xterm-keys on
set -s escape-time 0
bind -n C-Left send-keys Escape "[1;5D"
bind -n C-Right send-keys Escape "[1;5C"

# Visuals and cursor.
set -ag terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'
set -g pane-border-style 'bg=default'
set -g pane-active-border-style 'bg=default'

# Cyberdream theme.
set -g status-style "bg=default,fg=#ffffff"
set -g status-left-length 100
set -g status-right-length 100
set -g status-position bottom
set -g status-justify left
set -g status-left "#[fg=#5ea1ff,bold] #S #[fg=#7b8496]| "
set -g status-right "#[fg=#7b8496]#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/^/ /' | sed 's/$/ |/')#[fg=#7b8496]CPU:#[fg=#5eff6c]#($HOME/.config/tmux/cpu) #[fg=#7b8496]RAM:#[fg=#5ef1ff]#($HOME/.config/tmux/ram) #[fg=#7b8496]| #[fg=#bd5eff]%H:%M #[fg=#7b8496]%a %d"

set -g window-status-format "#[fg=#7b8496] #I:#W "
set -g window-status-current-format "#[fg=#5ea1ff,bold] #I:#W "
set -g window-status-separator ""
set -g pane-border-style "fg=#3c4048"
set -g pane-active-border-style "fg=#5ea1ff"
set -g message-style "bg=#3c4048,fg=#5ef1ff"
set -g message-command-style "bg=#3c4048,fg=#5ef1ff"

# Pane management.
unbind %
bind = split-window -h
unbind '"'
bind - split-window -v
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

# Fallback pane switching if vim-tmux-navigator is unavailable.
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Scrolling and copying.
set-window-option -g mode-keys vi
set -g @yank_action 'copy-pipe-and-cancel'
bind u copy-mode
bind v copy-mode
bind -n S-PageUp copy-mode -u
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi C-u send-keys -X halfpage-up
bind-key -T copy-mode-vi C-d send-keys -X halfpage-down

if-shell '[ -d ~/.tmux/plugins/vim-tmux-navigator ]' 'run-shell ~/.tmux/plugins/vim-tmux-navigator/vim-tmux-navigator.tmux'
if-shell '[ -d ~/.tmux/plugins/tpm ]' 'run-shell ~/.tmux/plugins/tpm/tpm'
