# name → ordered "label=dir" repo list, separated by spaces (paths must not
# contain spaces). Entries are targets available to explicit repo/role deep
# links; ordinary `open <ctx>` only restores the outer cards and never creates,
# renames, labels, or focuses Herdr/tmux internals. The first entry supplies the
# default CWD for a fresh session and fallback target for explicit role links.
# Admin is special: its single entry is one plain terminal target.
declare -A CTX_REPOS=(
  [UP]="mono=$HOME/Developer/Work/UP/mono"
  [Webroot]="helios-kiosk-sso=$HOME/Developer/Work/Webroot/AEM/SSO/helios-kiosk scribe=$HOME/Developer/Work/Webroot/scribe co-author-api=$HOME/Developer/Work/Webroot/co-author/api co-author-plugin=$HOME/Developer/Work/Webroot/co-author/plugin billing=$HOME/Developer/Work/Webroot/billing"
  [Sealant]="core=$HOME/Developer/OSS/Sealant/Core sealantd=$HOME/Developer/OSS/Sealant/Sealantd"
  [Side]="sandbox=$HOME/Developer/sandbox"
  [Admin]="term=$HOME"
)
# Profile dirs per helium's Local State on the 2026-08 NixOS install:
# Profile 1=Webroot, Profile 3=Personal, Profile 4=UP, Default="You" (unused).
declare -A CTX_HELIUM_PROFILE=(
  [UP]="Profile 4" [Webroot]="Profile 1" [Sealant]="Profile 3" [Side]="Profile 3" [Admin]="Profile 3"
)
MAIN_OUTPUT="DP-1"; TOP_OUTPUT="DP-2"; COMMS_OUTPUT="HDMI-A-1"
HELIUM_BIN="${HELIUM_BIN:-/opt/helium-browser-bin/helium}"   # niri-ctx falls back to `command -v helium`
CONTEXT_TERMINAL="${NIRI_CONTEXT_TERMINAL:-ghostty}"
SESSION_BACKEND="${SESSION_BACKEND:-herdr}"      # herdr | tmux — tmux is the invisible failure fallback
TOP_FOLLOW="off"             # devtools | ambient | off — DP-2 auto-switching disabled 2026-07-04 per user
