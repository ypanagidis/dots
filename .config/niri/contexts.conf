# name → project directory
declare -A CTX_DIR=(
  [UP]="$HOME/Developer/Work/UP"
  [Webroot]="$HOME"          # TODO: set real dir
  [Sealant]="$HOME"          # TODO: set real dir
  [Side]="$HOME"             # TODO: set real dir
  [Admin]="$HOME"
)
declare -A CTX_HELIUM_PROFILE=(
  [UP]="Profile 1" [Webroot]="Profile 3" [Sealant]="Default" [Side]="Default" [Admin]="Default"
)
MAIN_OUTPUT="DP-1"; TOP_OUTPUT="DP-2"; COMMS_OUTPUT="HDMI-A-1"
HELIUM_BIN="${HELIUM_BIN:-/opt/helium-browser-bin/helium}"   # niri-ctx falls back to `command -v helium`
CONTEXT_TERMINAL="${NIRI_CONTEXT_TERMINAL:-ghostty}"
AGENTS_BACKEND="tmux"        # "herdr" once configured; herdr failure ALWAYS falls back to tmux
TOP_FOLLOW="devtools"        # devtools | ambient | off — behavior of `niri-ctx watch`
