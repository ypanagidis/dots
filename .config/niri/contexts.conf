# name → ordered "label=dir" repo list, separated by spaces (paths must not
# contain spaces). Each repo is a herdr WORKSPACE in the context's work
# session, with role TABS (editor/agents/logs) inside it; the first entry is
# the default repo (fresh sessions start there, role deep-links fall back to
# it). Admin is special: its single entry is one plain workspace, no role tabs.
declare -A CTX_REPOS=(
  [UP]="mono=$HOME/Developer/Work/UP/mono"
  [Webroot]="webroot=$HOME/Developer/Work/Webroot"
  [Sealant]="core=$HOME/Developer/OSS/Sealant/Core sealantd=$HOME/Developer/OSS/Sealant/Sealantd"
  [Side]="sandbox=$HOME/Developer/sandbox"
  [Admin]="term=$HOME"
)
declare -A CTX_HELIUM_PROFILE=(
  [UP]="Profile 1" [Webroot]="Profile 3" [Sealant]="Default" [Side]="Default" [Admin]="Default"
)
MAIN_OUTPUT="DP-1"; TOP_OUTPUT="DP-2"; COMMS_OUTPUT="HDMI-A-1"
HELIUM_BIN="${HELIUM_BIN:-/opt/helium-browser-bin/helium}"   # niri-ctx falls back to `command -v helium`
CONTEXT_TERMINAL="${NIRI_CONTEXT_TERMINAL:-ghostty}"
SESSION_BACKEND="${SESSION_BACKEND:-herdr}"      # herdr | tmux — tmux is the invisible failure fallback
TOP_FOLLOW="off"             # devtools | ambient | off — DP-2 auto-switching disabled 2026-07-04 per user
